<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>台股商戰有聲書 V3.1</title>
  <style>
    :root{--blue:#0b5cab;--green:#16803c;--ink:#17365d;--bg:#f4f6f8}*{box-sizing:border-box}body{font-family:system-ui,"Microsoft JhengHei",sans-serif;padding:16px;max-width:640px;margin:auto;background:var(--bg);color:#172033}.container{background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px #0002}h2{font-size:1.45rem;color:var(--ink);margin:0}select,audio{width:100%;margin-top:18px}select{min-height:56px;padding:10px 14px;font-size:1.1rem;border-radius:9px;border:1px solid #aeb8c5;background:#fff}audio{min-height:54px}.auto-next{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px;border:1px solid #cbd9e8;border-radius:10px;background:#f5f9ff;font-size:1.05rem;font-weight:700;color:var(--ink)}.auto-next input{width:26px;height:26px;accent-color:var(--blue)}.play-button{width:100%;min-height:76px;margin-top:18px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:1.3rem;font-weight:800;touch-action:manipulation}.play-button:active{background:#0d5a29;transform:translateY(1px)}.seek-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.seek-button{min-height:64px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:1.08rem;font-weight:700;touch-action:manipulation}.seek-button:active{background:#073e74;transform:translateY(1px)}.status{margin-top:18px;font-size:1rem;color:#0056b3;line-height:1.5;font-weight:700}.transcript{margin-top:22px;border-top:1px solid #e5e9ee;padding-top:14px}.transcript summary{cursor:pointer;color:var(--ink);font-size:1.08rem;font-weight:800;padding:10px 0}.transcript-note{color:#64748b;font-size:.9rem;line-height:1.65;margin:6px 0 12px}.sync-adjust{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.sync-button{min-height:54px;border:0;border-radius:9px;background:#7a4b00;color:#fff;font-size:.98rem;font-weight:800}.sync-reset{grid-column:1/-1;background:#e8eef5;color:var(--ink)}.sync-status{text-align:center;color:#7a4b00;font-weight:700;font-size:.9rem;margin:2px 0 12px}.transcript-text{max-height:55vh;min-height:220px;overflow:auto;font-size:1.05rem;line-height:2;padding:16px;border:1px solid #d8e1eb;border-radius:10px;background:#fbfdff;scroll-behavior:smooth}.transcript-paragraph{margin:0 0 1em}.transcript-segment{padding:2px 1px;border-radius:4px;transition:background-color .18s,color .18s}.transcript-segment.active{background:#ffe679;color:#642d00;box-shadow:0 0 0 2px #ffe679;font-weight:700}.instructions{margin-top:22px;font-size:.92rem;color:#555;line-height:1.65;border-top:1px solid #e5e9ee;padding-top:14px}
  </style>
</head>
<body>
  <div class="container">
    <h2>台股商戰有聲書 <span style="font-size:.72em;color:#64748b">V3.1</span></h2>
    <select id="trackSelect" aria-label="選擇章節部分">
      <optgroup label="2003 重生交易版（每部 40 章）">
        <option value="重生1-40章.mp3">重生版 第一部分：第 1–40 章</option>
        <option value="重生41-80章.mp3">重生版 第二部分：第 41–80 章</option>
        <option value="重生81-120章.mp3">重生版 第三部分：第 81–120 章</option>
        <option value="重生121-160章.mp3">重生版 第四部分：第 121–160 章</option>
        <option value="重生161-200章.mp3">重生版 第五部分：第 161–200 章</option>
        <option value="重生201-240章.mp3">重生版 第六部分：第 201–240 章</option>
        <option value="重生241-280章.mp3">重生版 第七部分：第 241–280 章</option>
        <option value="重生281-320章.mp3">重生版 第八部分：第 281–320 章</option>
        <option value="重生321-360章.mp3">重生版 第九部分：第 321–360 章</option>
      </optgroup>
      <optgroup label="原版（每部 36 章）">
        <option value="1-36章.mp3">原版 第一部分：第 1–36 章</option>
        <option value="37-72章.mp3">原版 第二部分：第 37–72 章</option>
        <option value="73-108章.mp3">原版 第三部分：第 73–108 章</option>
        <option value="109-144章.mp3">原版 第四部分：第 109–144 章</option>
        <option value="145-180章.mp3">原版 第五部分：第 145–180 章</option>
        <option value="181-216章.mp3">原版 第六部分：第 181–216 章</option>
        <option value="217-252章.mp3">原版 第七部分：第 217–252 章</option>
        <option value="253-288章.mp3">原版 第八部分：第 253–288 章</option>
        <option value="289-324章.mp3">原版 第九部分：第 289–324 章</option>
        <option value="325-360章.mp3">原版 第十部分：第 325–360 章</option>
      </optgroup>
    </select>

    <label class="auto-next"><input id="autoNext" type="checkbox"><span>播完自動播放下一部</span></label>
    <button class="play-button" id="playPause" type="button">▶ 點擊播放</button>
    <audio id="audioPlayer" controls preload="auto" playsinline></audio>
    <div class="seek-controls"><button class="seek-button" id="back10" type="button">↶ 倒退 10 秒</button><button class="seek-button" id="forward10" type="button">前進 10 秒 ↷</button></div>
    <div class="status" id="statusText">準備就緒，點擊播放即可</div>
    <details class="transcript" id="transcriptDetails" open><summary>📖 文字同步對照（目前句子會反白）</summary><p class="transcript-note" id="transcriptNote">文字會隨音檔切換，播放時自動捲到目前句子。</p><div class="sync-adjust"><button class="sync-button" id="captionSlower" type="button">↑ 黃色往上<br>退後 10 秒</button><button class="sync-button" id="captionFaster" type="button">↓ 黃色往下<br>前進 10 秒</button><button class="sync-button sync-reset" id="captionReset" type="button">重設文字同步</button></div><div class="sync-status" id="syncStatus">文字同步：原始估算位置</div><div class="transcript-text" id="transcriptText">正在準備文字對照…</div></details>
    <div class="instructions">勾選「播完自動播放下一部」後，每一部結束會直接接下一部。取消勾選後，則會重複播放目前這一部。藍牙耳機的播放／暫停鍵也可繼續使用；每一部會分別記住播放進度。</div>
  </div>

  <script src="transcripts.js?v=3.1"></script>
  <script>
    const select=document.getElementById('trackSelect'),player=document.getElementById('audioPlayer'),status=document.getElementById('statusText'),playPause=document.getElementById('playPause'),autoNext=document.getElementById('autoNext'),transcriptText=document.getElementById('transcriptText'),transcriptNote=document.getElementById('transcriptNote'),transcriptDetails=document.getElementById('transcriptDetails'),syncStatus=document.getElementById('syncStatus');
    const tracks=Array.from(select.options,option=>option.value);
    let currentFile=localStorage.getItem('audioLastTrack')||select.value,lastSavedSecond=-1,transcriptSegments=[],transcriptWeights=[],transcriptTotalWeight=0,activeTranscriptIndex=-1,followFrame=0,syncOffsetSeconds=0;
    if(!tracks.includes(currentFile))currentFile=select.value;
    select.value=currentFile;
    autoNext.checked=localStorage.getItem('audioAutoNext')==='true';
    const progressKey=()=>`audioProgress_${currentFile}`;
    const syncKey=()=>`audioTextSync_${currentFile}`;
    const currentName=()=>select.options[select.selectedIndex].text;

    function formatTime(seconds){const m=Math.floor(seconds/60),s=Math.floor(seconds%60);return `${m} 分 ${s} 秒`}
    function saveProgress(){if(Number.isFinite(player.currentTime)&&player.currentTime>0)localStorage.setItem(progressKey(),String(player.currentTime))}
    function updateSyncStatus(){syncStatus.textContent=syncOffsetSeconds===0?'文字同步：原始估算位置':syncOffsetSeconds<0?`文字同步：黃色已退後 ${Math.abs(syncOffsetSeconds)} 秒`:`文字同步：黃色已前進 ${syncOffsetSeconds} 秒`}
    function loadSyncOffset(){syncOffsetSeconds=Number(localStorage.getItem(syncKey())||0);updateSyncStatus()}
    function adjustSync(seconds){syncOffsetSeconds=Math.max(-600,Math.min(600,syncOffsetSeconds+seconds));localStorage.setItem(syncKey(),String(syncOffsetSeconds));updateSyncStatus();updateTranscriptPosition(true)}
    function updateLoop(){player.loop=!autoNext.checked}
    function sentenceParts(paragraph){return paragraph.match(/[^。！？!?；;]+[。！？!?；;]?/g)||[paragraph]}
    function segmentWeight(text){const useful=(text.match(/[\p{L}\p{N}]/gu)||[]).length;const pauses=(text.match(/[，、：；。！？,.!?;:]/g)||[]).length;return Math.max(3,useful+pauses*2)}
    function updateTranscript(){
      const text=(window.AUDIO_TRANSCRIPTS||{})[currentFile];
      transcriptText.replaceChildren();transcriptSegments=[];transcriptWeights=[];transcriptTotalWeight=0;activeTranscriptIndex=-1;
      if(!text){transcriptText.textContent='這一部分尚未提供文字對照。';transcriptNote.textContent='目前沒有這個音檔的文字。';return}
      for(const paragraphText of text.split(/\n{2,}/).map(x=>x.trim()).filter(Boolean)){
        const paragraph=document.createElement('p');paragraph.className='transcript-paragraph';
        for(const part of sentenceParts(paragraphText)){
          const span=document.createElement('span');span.className='transcript-segment';span.textContent=part;paragraph.appendChild(span);
          transcriptSegments.push(span);const weight=segmentWeight(part);transcriptWeights.push(weight);transcriptTotalWeight+=weight;
        }
        transcriptText.appendChild(paragraph);
      }
      if(currentFile==='重生1-40章.mp3')transcriptNote.textContent='第 1～40 章已換成新重寫文字；請重新轉製並替換同名 MP3，聲音才會與文字相同。黃色句子依播放時間估算同步。';
      else if(currentFile.startsWith('重生'))transcriptNote.textContent='這部分目前仍是舊稿文字；完成重寫後再更新。黃色句子依播放時間估算同步。';
      else transcriptNote.textContent='原版文字已補上。黃色句子會依播放時間估算位置並自動捲動。';
    }
    function transcriptIndexForTime(){
      if(!transcriptSegments.length||!Number.isFinite(player.duration)||player.duration<=0)return -1;
      const adjusted=Math.max(0,Math.min(player.duration,player.currentTime+syncOffsetSeconds));const target=(adjusted/player.duration)*transcriptTotalWeight;let total=0;
      for(let i=0;i<transcriptWeights.length;i++){total+=transcriptWeights[i];if(total>=target)return i}
      return transcriptSegments.length-1;
    }
    function updateTranscriptPosition(force=false){
      const next=transcriptIndexForTime();if(next<0||(!force&&next===activeTranscriptIndex))return;
      if(activeTranscriptIndex>=0)transcriptSegments[activeTranscriptIndex]?.classList.remove('active');
      activeTranscriptIndex=next;const current=transcriptSegments[next];current.classList.add('active');
      if(transcriptDetails.open){
        const box=transcriptText.getBoundingClientRect(),line=current.getBoundingClientRect();
        const target=Math.max(0,transcriptText.scrollTop+(line.top-box.top)-24);
        transcriptText.scrollTo({top:target,behavior:force?'auto':'smooth'});
      }
    }
    function followTranscript(){updateTranscriptPosition();if(!player.paused&&!player.ended)followFrame=requestAnimationFrame(followTranscript)}
    function updateMediaSession(){if(!('mediaSession'in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:currentName(),artist:'台股商戰有聲書',album:'有聲書播放器'})}
    function safePlay(){player.play().catch(()=>{status.textContent='請先在網頁上按一次播放；之後可用藍牙耳機控制。'})}
    function loadTrack(file,playAfterLoad=false){saveProgress();cancelAnimationFrame(followFrame);currentFile=file;localStorage.setItem('audioLastTrack',file);select.value=file;player.pause();player.src=encodeURI(file);loadSyncOffset();updateLoop();updateMediaSession();updateTranscript();player.load();status.textContent=`載入中：${currentName()}`;playPause.textContent='▶ 點擊播放';if(playAfterLoad)player.addEventListener('canplay',safePlay,{once:true})}
    function seekBy(seconds){if(!Number.isFinite(player.duration))return;player.currentTime=Math.max(0,Math.min(player.duration,player.currentTime+seconds));saveProgress();status.textContent=`目前位置：${formatTime(player.currentTime)}`}
    function nextTrack(){const index=tracks.indexOf(currentFile);return index>=0&&index<tracks.length-1?tracks[index+1]:null}

    select.addEventListener('change',()=>loadTrack(select.value));
    autoNext.addEventListener('change',()=>{localStorage.setItem('audioAutoNext',String(autoNext.checked));updateLoop();status.textContent=autoNext.checked?'已開啟：播完自動下一部':'已關閉：重複播放目前這一部'});
    playPause.addEventListener('click',()=>player.paused?safePlay():player.pause());
    document.getElementById('back10').addEventListener('click',()=>seekBy(-10));
    document.getElementById('forward10').addEventListener('click',()=>seekBy(10));
    document.getElementById('captionSlower').addEventListener('click',()=>adjustSync(-10));
    document.getElementById('captionFaster').addEventListener('click',()=>adjustSync(10));
    document.getElementById('captionReset').addEventListener('click',()=>{syncOffsetSeconds=0;localStorage.removeItem(syncKey());updateSyncStatus();updateTranscriptPosition(true)});
    player.addEventListener('loadedmetadata',()=>{const saved=Number(localStorage.getItem(progressKey())||0);if(saved>0&&saved<player.duration-2){player.currentTime=saved;status.textContent=`已回到上次進度：${formatTime(saved)}`}else status.textContent='準備就緒，點擊播放即可';updateTranscriptPosition(true)});
    player.addEventListener('timeupdate',()=>{const second=Math.floor(player.currentTime);if(second!==lastSavedSecond&&second%5===0){lastSavedSecond=second;saveProgress()}updateTranscriptPosition()});
    player.addEventListener('seeked',()=>updateTranscriptPosition(true));
    player.addEventListener('play',()=>{cancelAnimationFrame(followFrame);transcriptDetails.open=true;playPause.textContent='⏸ 暫停播放';status.textContent=`正在播放：${currentName()}`;followTranscript()});
    player.addEventListener('pause',()=>{cancelAnimationFrame(followFrame);saveProgress();if(!player.ended)playPause.textContent='▶ 繼續播放'});
    player.addEventListener('ended',()=>{localStorage.removeItem(progressKey());const next=nextTrack();if(autoNext.checked&&next){status.textContent='本部結束，正在播放下一部…';loadTrack(next,true)}else if(autoNext.checked){status.textContent='全部播放完畢'}else{status.textContent='本部結束，將重複播放目前這一部'}});
    window.addEventListener('pagehide',saveProgress);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProgress()});

    if('mediaSession'in navigator){for(const [action,handler] of [['play',safePlay],['pause',()=>player.pause()],['seekbackward',()=>seekBy(-10)],['seekforward',()=>seekBy(10)],['nexttrack',()=>{const next=nextTrack();if(next)loadTrack(next,true)}],['previoustrack',()=>seekBy(-10)]]){try{navigator.mediaSession.setActionHandler(action,handler)}catch{}}}
    loadTrack(currentFile);
  </script>
</body>
</html>
