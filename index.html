<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>有聲書線上播放器</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f5f5f5; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { font-size: 1.2rem; color: #333; margin-top: 0; }
        select { width: 100%; padding: 10px; margin-top: 15px; font-size: 1rem; border-radius: 5px; border: 1px solid #ccc; }
        audio { width: 100%; margin-top: 15px; outline: none; }
        .status { margin-top: 15px; font-size: 0.95rem; color: #0056b3; line-height: 1.5; font-weight: bold; }
        .instructions { margin-top: 20px; font-size: 0.85rem; color: #666; line-height: 1.5; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>台股商戰有聲書</h2>

        <!-- 檔案選擇下拉選單 -->
        <select id="trackSelect">
            <!-- 只要上傳了新檔案，就在這裡加一行 -->
            <option value="audiobook.mp3">第一部分 (1-3章)</option>
            <option value="audiobook _02.mp3">第二部分 (4-6章)</option>
            <option value="audiobook _03.mp3">第三部分 (7-10章)</option>
        </select>

        <div class="status" id="statusText">請選擇檔案...</div>
        <audio id="audioPlayer" controls></audio>
        
        <div class="instructions">
            📌 說明：<br>
            1. 從下拉選單切換想聽的章節。<br>
            2. 每個章節都會「獨立記憶」各自的播放進度。<br>
            3. 網頁更新後，請於手機瀏覽器強制重新整理。
        </div>
    </div>

    <script>
        const trackSelect = document.getElementById('trackSelect');
        const player = document.getElementById('audioPlayer');
        const statusText = document.getElementById('statusText');
        
        let currentFile = trackSelect.value;
        let storageKey = 'audioProgress_' + currentFile;

        // 初始化：載入預設的第一個檔案
        loadTrack(currentFile);

        // 當下拉選單改變時，切換檔案
        trackSelect.addEventListener('change', function() {
            currentFile = this.value;
            storageKey = 'audioProgress_' + currentFile;
            loadTrack(currentFile);
            
            // 切換檔案後自動嘗試播放
            player.play().catch(e => console.log("等待手動播放"));
        });

        function loadTrack(filename) {
            player.src = filename;
            statusText.textContent = `載入中...`;
        }

        player.onloadedmetadata = function() {
            const savedTime = localStorage.getItem(storageKey);
            if (savedTime && savedTime > 0) {
                player.currentTime = parseFloat(savedTime);
                statusText.textContent = `🎵 已自動跳轉至上次進度：${formatTime(savedTime)}`;
            } else {
                statusText.textContent = `🎵 準備就緒，點擊播放即可`;
            }
        };

        player.addEventListener('timeupdate', function() {
            if (player.currentTime > 0) {
                localStorage.setItem(storageKey, player.currentTime);
            }
        });

        player.addEventListener('ended', function() {
            localStorage.removeItem(storageKey);
            statusText.textContent = `✅ 本章節播放完畢！`;
        });

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h} 小時 ${m} 分 ${s} 秒`;
            return `${m} 分 ${s} 秒`;
        }
    </script>
</body>
</html>
