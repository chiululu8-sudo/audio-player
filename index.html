<!doctype html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14395f">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <title>前方五公里｜有聲書</title>
  <style>
    :root{--navy:#14395f;--blue:#1769aa;--green:#16834b;--ink:#172538;--muted:#607086;--line:#cbd7e4;--bg:#eef3f8;--active:#ffe47a}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#e6f0f8 0,#f3f6f9 380px);color:var(--ink);font-family:"Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif}
    button,select{font:inherit;touch-action:manipulation}
    .shell{width:min(760px,100%);margin:auto;padding:14px}
    .panel{background:#fff;border:1px solid #dce5ed;border-radius:18px;box-shadow:0 7px 24px #24486616;padding:clamp(16px,4vw,26px);margin-bottom:16px}
    .title-row{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
    h1{margin:0;color:var(--navy);font-size:clamp(28px,6vw,42px);line-height:1.2}
    .version{color:var(--muted);font-weight:700;white-space:nowrap}
    .subtitle{margin:9px 0 0;color:var(--muted);font-size:18px}
    .track-name{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:20px 0 10px;padding:13px 15px;border:1px solid var(--line);border-radius:12px;background:#f8fbfe;color:var(--navy);font-size:18px;font-weight:800}
    .track-select{flex:1;max-width:430px;color:var(--navy);font-weight:800}
    audio{width:100%;min-height:58px}
    .big-play{width:100%;min-height:78px;margin-top:16px;border:0;border-radius:14px;background:var(--green);color:#fff;font-size:25px;font-weight:900;cursor:pointer}
    .seek-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .seek,.sync-button{min-height:62px;border:0;border-radius:12px;background:var(--blue);color:#fff;font-size:19px;font-weight:800;cursor:pointer}
    .status{min-height:1.5em;margin:14px 2px 0;color:#075cb0;font-size:17px;font-weight:700;line-height:1.55}
    .settings{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
    .setting{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;font-weight:700}
    select{min-height:44px;border:1px solid #9fb3c7;border-radius:9px;background:#fff;padding:6px 10px}
    input[type=checkbox]{width:27px;height:27px;accent-color:var(--blue)}
    .transcript-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:8px}
    h2{margin:0;color:var(--navy);font-size:25px}
    .transcript-note{margin:8px 0 13px;color:var(--muted);line-height:1.6}
    .sync-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
    .sync-button{min-height:56px;background:#8b5b17;font-size:17px}
    .reset{grid-column:1/-1;background:#e7eef6;color:var(--navy)}
    .sync-status{text-align:center;color:#805207;font-weight:800;margin:8px 0 13px}
    .transcript{height:min(calc(100dvh - 180px),820px);min-height:520px;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;scroll-behavior:smooth;border:1px solid var(--line);border-radius:13px;background:#fbfdff;padding:clamp(14px,4vw,24px);font-size:21px;line-height:1.95}
    .segment{display:block;margin:0 0 .8em;padding:.18em .32em;border-radius:7px;cursor:pointer;white-space:pre-wrap}
    .segment:hover{background:#eef5fb}
    .segment.active{background:var(--active);box-shadow:inset 5px 0 #c68b00;color:#251d00;font-weight:800}
    .empty{text-align:center;color:var(--muted);padding:50px 10px;line-height:1.7}
    .tip{margin-top:12px;color:var(--muted);font-size:15px;line-height:1.65}
    button:focus-visible,select:focus-visible,input:focus-visible{outline:4px solid #f2bd32;outline-offset:2px}
    @media(max-width:620px){.shell{padding:9px}.settings{grid-template-columns:1fr}.track-name{align-items:stretch;flex-direction:column}.track-select{max-width:none;width:100%}.transcript{height:calc(100dvh - 145px);min-height:440px;font-size:20px}.seek,.sync-button{font-size:17px}.title-row{align-items:flex-start}}
  </style>
</head>
<body>
  <main class="shell">
    <section class="panel">
      <div class="title-row">
        <div><h1>前方五公里</h1><p class="subtitle" id="subtitle">第一季｜第1～10集</p></div>
        <span class="version">V1.3.1</span>
      </div>
      <div class="track-name">
        <label for="trackSelect">選擇集數</label>
        <select class="track-select" id="trackSelect" aria-label="選擇集數">
          <option value="01-10">第一部分｜第1～10集</option>
          <option value="11-20">第二部分｜第11～20集</option>
          <option value="21-40">第三部分｜第21～40集</option>
          <option value="41-80">完結篇｜第41～80集</option>
        </select>
      </div>
      <div class="settings">
        <div class="setting"><label for="speed">播放速度</label><select id="speed"><option value="0.75">0.75倍</option><option value="1" selected>正常</option><option value="1.25">1.25倍</option><option value="1.5">1.5倍</option><option value="2">2倍</option></select></div>
        <div class="setting"><label for="autoFollow">文字自動跟隨</label><input id="autoFollow" type="checkbox" checked></div>
      </div>
      <div class="seek-grid">
        <button class="seek" id="back10" type="button">↶ 倒退10秒</button>
        <button class="seek" id="forward10" type="button">前進10秒 ↷</button>
      </div>
      <button class="big-play" id="bigPlay" type="button">▶ 點擊播放</button>
      <audio id="player" controls preload="metadata" playsinline></audio>
      <div class="status" id="status">準備就緒，點擊播放即可。</div>
    </section>

    <section class="panel">
      <div class="transcript-head"><h2>聲音文字同步</h2></div>
      <p class="transcript-note">目前念到的句子會標成黃色，並自動移到文字框中央。點選任一句可跳到約略位置。</p>
      <div class="transcript" id="transcript"><div class="empty">正在準備小說文字……</div></div>
      <div class="tip">文字位置依整段錄音時間估算；如果語速改變，可用「文字太快／太慢」調整。播放進度及校正值會保存在這台裝置。</div>
      <div class="sync-grid">
        <button class="sync-button" id="textLater" type="button">文字太快<br>延後10秒</button>
        <button class="sync-button" id="textEarlier" type="button">文字太慢<br>提前10秒</button>
        <button class="sync-button reset" id="syncReset" type="button">重設文字同步</button>
      </div>
      <div class="sync-status" id="syncStatus">文字同步：原始估算位置</div>
    </section>
  </main>

  <script src="transcripts.js?v=1.3.1"></script>
  <script>
    (()=>{
      'use strict';
      const player=document.getElementById('player'),bigPlay=document.getElementById('bigPlay'),status=document.getElementById('status'),transcript=document.getElementById('transcript'),syncStatus=document.getElementById('syncStatus'),speed=document.getElementById('speed'),autoFollow=document.getElementById('autoFollow'),trackSelect=document.getElementById('trackSelect'),subtitle=document.getElementById('subtitle');
      const transcriptMap=window.FRONT_FIVE_KM_TRANSCRIPTS||{'01-10':window.FRONT_FIVE_KM_TRANSCRIPT||''};
      const tracks={
        '01-10':{label:'第一部分｜第1～10集',subtitle:'第一季｜第1～10集',mediaTitle:'前方五公里｜第一季第1～10集',src:'front-five-km-s1-e01-10.mp3'},
        '11-20':{label:'第二部分｜第11～20集',subtitle:'第一季｜第11～20集',mediaTitle:'前方五公里｜第一季第11～20集',src:'front-five-km-s1-e11-20.mp3'},
        '21-40':{label:'第三部分｜第21～40集',subtitle:'第二季｜第21～40集',mediaTitle:'前方五公里｜第二季第21～40集',src:'https://raw.githubusercontent.com/chiululu8-sudo/audio-player/main/front-five-km-s2-e21-40.mp3'},
        '41-80':{label:'完結篇｜第41～80集',subtitle:'完結篇｜第41～80集',mediaTitle:'前方五公里｜完結篇第41～80集',src:'https://raw.githubusercontent.com/chiululu8-sudo/audio-player/main/front-five-km-final-e41-80.mp3'}
      };
      const trackKey='frontFiveKmTrackV2',speedKey='frontFiveKmSpeedV1';
      let currentTrack='01-10',progressKey='',syncKey='',text='',segments=[],weights=[],weightStarts=[],totalWeight=0,activeIndex=-1,syncOffset=0,followFrame=0,lastSaved=-1;
      const formatTime=s=>{s=Math.max(0,Math.floor(Number(s)||0));const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`:`${m}:${String(sec).padStart(2,'0')}`};
      const sentenceParts=value=>{const clean=value.replace(/\r\n?/g,'\n').trim();if(!clean)return[];const result=[];for(const block of clean.split(/\n{2,}/).map(v=>v.trim()).filter(Boolean)){if(block.length<=54){result.push(block);continue}const parts=block.match(/[^。！？!?；;\n]+[。！？!?；;]?/g)||[block];let buffer='';for(const raw of parts){const part=raw.trim();if(!part)continue;if(buffer&&buffer.length+part.length>72){result.push(buffer);buffer=part}else buffer+=part}if(buffer)result.push(buffer)}return result};
      const segmentWeight=value=>Math.max(4,value.replace(/\s/g,'').length+(value.match(/[。！？!?；;，,：:]/g)||[]).length*2.4);
      function renderText(){transcript.replaceChildren();segments=[];weights=[];weightStarts=[];totalWeight=0;if(!text){transcript.innerHTML='<div class="empty">目前沒有文字內容。</div>';return}const frag=document.createDocumentFragment();for(const part of sentenceParts(text)){weightStarts.push(totalWeight);const w=segmentWeight(part);weights.push(w);totalWeight+=w;const span=document.createElement('span');span.className='segment';span.textContent=part;span.addEventListener('click',()=>{if(!Number.isFinite(player.duration)||player.duration<=0)return;const index=segments.indexOf(span);player.currentTime=Math.max(0,Math.min(player.duration,(weightStarts[index]/totalWeight)*player.duration-syncOffset));updateHighlight(true)});segments.push(span);frag.appendChild(span)}transcript.appendChild(frag)}
      function indexForTime(){if(!segments.length||!Number.isFinite(player.duration)||player.duration<=0)return-1;const adjusted=Math.max(0,Math.min(player.duration,player.currentTime+syncOffset));const target=adjusted/player.duration*totalWeight;let low=0,high=weightStarts.length-1,answer=0;while(low<=high){const mid=(low+high)>>1;if(weightStarts[mid]<=target){answer=mid;low=mid+1}else high=mid-1}return answer}
      function updateHighlight(force=false){const next=indexForTime();if(next<0||(!force&&next===activeIndex))return;if(activeIndex>=0)segments[activeIndex]?.classList.remove('active');activeIndex=next;const current=segments[next];current.classList.add('active');if(autoFollow.checked){const top=current.offsetTop-transcript.offsetTop-transcript.clientHeight/2+current.offsetHeight/2;transcript.scrollTo({top:Math.max(0,top),behavior:force?'auto':'smooth'})}}
      function follow(){updateHighlight();if(!player.paused&&!player.ended)followFrame=requestAnimationFrame(follow)}
      function updateSync(){localStorage.setItem(syncKey,String(syncOffset));syncStatus.textContent=syncOffset===0?'文字同步：原始估算位置':syncOffset>0?`文字同步：文字已提前 ${syncOffset} 秒`:`文字同步：文字已延後 ${Math.abs(syncOffset)} 秒`;updateHighlight(true)}
      function seekBy(delta){if(!Number.isFinite(player.duration))return;player.currentTime=Math.max(0,Math.min(player.duration,player.currentTime+delta));saveProgress();updateHighlight(true)}
      function saveProgress(){if(progressKey&&Number.isFinite(player.currentTime)&&player.currentTime>0)localStorage.setItem(progressKey,String(player.currentTime))}
      function safePlay(){player.play().catch(()=>status.textContent='請再按一次播放。')}
      function mediaSession(){if(!('mediaSession'in navigator))return;try{navigator.mediaSession.metadata=new MediaMetadata({title:tracks[currentTrack].mediaTitle,artist:'有聲書'});navigator.mediaSession.setActionHandler('play',safePlay);navigator.mediaSession.setActionHandler('pause',()=>player.pause());navigator.mediaSession.setActionHandler('seekbackward',()=>seekBy(-10));navigator.mediaSession.setActionHandler('seekforward',()=>seekBy(10));navigator.mediaSession.setActionHandler('seekto',e=>{if(Number.isFinite(e.seekTime))player.currentTime=e.seekTime})}catch{}}
      function loadTrack(id){
        if(!tracks[id])id='01-10';
        if(player.src)saveProgress();
        cancelAnimationFrame(followFrame);player.pause();
        currentTrack=id;progressKey=`frontFiveKmProgressV2_${id}`;syncKey=`frontFiveKmSyncV2_${id}`;syncOffset=Number(localStorage.getItem(syncKey)||0);text=typeof transcriptMap[id]==='string'?transcriptMap[id]:'';lastSaved=-1;activeIndex=-1;
        localStorage.setItem(trackKey,id);trackSelect.value=id;subtitle.textContent=tracks[id].subtitle;player.src=tracks[id].src;player.load();
        transcript.scrollTop=0;renderText();updateSync();mediaSession();bigPlay.textContent='▶ 點擊播放';status.textContent=`準備播放：${tracks[id].label}`;
      }
      bigPlay.addEventListener('click',()=>player.paused?safePlay():player.pause());
      document.getElementById('back10').addEventListener('click',()=>seekBy(-10));document.getElementById('forward10').addEventListener('click',()=>seekBy(10));
      document.getElementById('textLater').addEventListener('click',()=>{syncOffset-=10;updateSync()});document.getElementById('textEarlier').addEventListener('click',()=>{syncOffset+=10;updateSync()});document.getElementById('syncReset').addEventListener('click',()=>{syncOffset=0;updateSync()});
      trackSelect.addEventListener('change',()=>loadTrack(trackSelect.value));
      speed.value=localStorage.getItem(speedKey)||'1';player.playbackRate=Number(speed.value);speed.addEventListener('change',()=>{player.playbackRate=Number(speed.value);localStorage.setItem(speedKey,speed.value)});
      player.addEventListener('loadedmetadata',()=>{const saved=Number(localStorage.getItem(progressKey)||0);if(saved>0&&saved<player.duration-2){player.currentTime=saved;status.textContent=`已回到上次進度：${formatTime(saved)}`}updateHighlight(true)});
      player.addEventListener('timeupdate',()=>{const second=Math.floor(player.currentTime);if(second!==lastSaved&&second%5===0){lastSaved=second;saveProgress()}updateHighlight()});
      player.addEventListener('play',()=>{cancelAnimationFrame(followFrame);bigPlay.textContent='❚❚ 暫停播放';status.textContent=`正在播放：${tracks[currentTrack].label}`;follow()});
      player.addEventListener('pause',()=>{cancelAnimationFrame(followFrame);saveProgress();if(!player.ended)bigPlay.textContent='▶ 繼續播放'});
      player.addEventListener('seeked',()=>updateHighlight(true));player.addEventListener('ended',()=>{localStorage.removeItem(progressKey);bigPlay.textContent='↺ 重新播放';status.textContent=`${tracks[currentTrack].label}播放完畢。`});
      player.addEventListener('error',()=>status.textContent='音檔載入失敗，請重新整理後再試。');
      document.addEventListener('visibilitychange',saveProgress);window.addEventListener('beforeunload',saveProgress);
      loadTrack(localStorage.getItem(trackKey)||'01-10');
    })();
  </script>
</body>
</html>
