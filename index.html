<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>本地有聲書播放器</title>
    <style>
        body { font-family: sans-serif; padding: 20px; max-width: 600px; margin: auto; background-color: #f5f5f5; }
        .container { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        h2 { font-size: 1.2rem; color: #333; margin-top: 0; }
        input[type="file"] { margin: 15px 0; width: 100%; border: 1px solid #ccc; padding: 10px; border-radius: 5px; }
        audio { width: 100%; margin-top: 15px; outline: none; }
        .status { margin-top: 15px; font-size: 0.95rem; color: #0056b3; line-height: 1.5; font-weight: bold; }
        .instructions { margin-top: 20px; font-size: 0.85rem; color: #666; line-height: 1.5; border-top: 1px solid #eee; padding-top: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <h2>有聲書播放器 (自動記憶進度)</h2>
        <input type="file" id="audioUploader" accept="audio/*">
        <div class="status" id="statusText">請點擊上方按鈕選擇有聲書檔案 (MP3)</div>
        <audio id="audioPlayer" controls></audio>
        
        <div class="instructions">
            📌 說明：<br>
            1. 本網頁無須連網，純本地執行。<br>
            2. 進度會自動儲存在目前使用的瀏覽器中。<br>
            3. 若更換其他檔案，系統會依據「檔案名稱」獨立記憶各自的進度。
        </div>
    </div>

    <script>
        const uploader = document.getElementById('audioUploader');
        const player = document.getElementById('audioPlayer');
        const statusText = document.getElementById('statusText');
        let currentFileName = '';

        uploader.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (!file) return;

            currentFileName = file.name;
            const objectUrl = URL.createObjectURL(file);
            player.src = objectUrl;

            statusText.textContent = `檔案載入中...`;

            player.onloadedmetadata = function() {
                const savedTime = localStorage.getItem('audioProgress_' + currentFileName);
                if (savedTime && savedTime > 0) {
                    player.currentTime = parseFloat(savedTime);
                    statusText.textContent = `🎵 已跳轉至上次進度：${formatTime(savedTime)} 
[目前播放：${currentFileName}]`;
                } else {
                    statusText.textContent = `🎵 開始全新播放 
[目前播放：${currentFileName}]`;
                }
                player.play().catch(e => console.log("等待使用者互動以開始播放"));
            };
        });

        player.addEventListener('timeupdate', function() {
            if (currentFileName && player.currentTime > 0) {
                localStorage.setItem('audioProgress_' + currentFileName, player.currentTime);
            }
        });

        player.addEventListener('ended', function() {
            if (currentFileName) {
                localStorage.removeItem('audioProgress_' + currentFileName);
                statusText.textContent = `✅ 播放完畢，進度已歸零。 
[檔案：${currentFileName}]`;
            }
        });

        function formatTime(seconds) {
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            if (h > 0) return `${h} 小時 ${m} 分 ${s} 秒`;
            return `${m} 分 ${s} 秒`;
        }
    </script>
</body>
</html>
