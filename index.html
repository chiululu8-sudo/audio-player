<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>台股商戰有聲書</title>
  <style>
    :root{--blue:#0b5cab;--green:#16803c;--ink:#17365d;--bg:#f4f6f8}*{box-sizing:border-box}body{font-family:system-ui,"Microsoft JhengHei",sans-serif;padding:16px;max-width:640px;margin:auto;background:var(--bg);color:#172033}.container{background:#fff;padding:22px;border-radius:14px;box-shadow:0 2px 10px #0002}h2{font-size:1.45rem;color:var(--ink);margin:0}select,audio{width:100%;margin-top:18px}select{min-height:56px;padding:10px 14px;font-size:1.1rem;border-radius:9px;border:1px solid #aeb8c5;background:#fff}audio{min-height:54px}.auto-next{display:flex;align-items:center;gap:12px;margin-top:18px;padding:14px;border:1px solid #cbd9e8;border-radius:10px;background:#f5f9ff;font-size:1.05rem;font-weight:700;color:var(--ink)}.auto-next input{width:26px;height:26px;accent-color:var(--blue)}.play-button{width:100%;min-height:76px;margin-top:18px;border:0;border-radius:12px;background:var(--green);color:#fff;font-size:1.3rem;font-weight:800;touch-action:manipulation}.play-button:active{background:#0d5a29;transform:translateY(1px)}.seek-controls{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:18px}.seek-button{min-height:64px;border:0;border-radius:10px;background:var(--blue);color:#fff;font-size:1.08rem;font-weight:700;touch-action:manipulation}.seek-button:active{background:#073e74;transform:translateY(1px)}.status{margin-top:18px;font-size:1rem;color:#0056b3;line-height:1.5;font-weight:700}.instructions{margin-top:22px;font-size:.92rem;color:#555;line-height:1.65;border-top:1px solid #e5e9ee;padding-top:14px}
  </style>
</head>
<body>
  <div class="container">
    <h2>台股商戰有聲書</h2>
    <select id="trackSelect" aria-label="選擇章節部分">
      <optgroup label="2003 重生交易版（每部 40 章）">
        <option value="重生1-40章.mp3">重生版 第一部分：第 1–40 章</option>
        <option value="重生41-80章.mp3">重生版 第二部分：第 41–80 章</option>
        <option value="重生81-120章.mp3">重生版 第三部分：第 81–120 章</option>
        <option value="重生121-160章.mp3">重生版 第四部分：第 121–160 章</option>
        <option value="重生161-200章.mp3">重生版 第五部分：第 161–200 章</option>
        <option value="重生201-240章.mp3">重生版 第六部分：第 201–240 章</option>
        <option value="重生241-280章.mp3">重生版 第七部分：第 241–280 章</option>
        <option value="重生281-320章.mp3">重生版 第八部分：第 281–320 章</option>
        <option value="重生321-360章.mp3">重生版 第九部分：第 321–360 章</option>
      </optgroup>
      <optgroup label="原版（每部 36 章）">
        <option value="1-36章.mp3">原版 第一部分：第 1–36 章</option>
        <option value="37-72章.mp3">原版 第二部分：第 37–72 章</option>
        <option value="73-108章.mp3">原版 第三部分：第 73–108 章</option>
        <option value="109-144章.mp3">原版 第四部分：第 109–144 章</option>
        <option value="145-180章.mp3">原版 第五部分：第 145–180 章</option>
        <option value="181-216章.mp3">原版 第六部分：第 181–216 章</option>
        <option value="217-252章.mp3">原版 第七部分：第 217–252 章</option>
        <option value="253-288章.mp3">原版 第八部分：第 253–288 章</option>
        <option value="289-324章.mp3">原版 第九部分：第 289–324 章</option>
        <option value="325-360章.mp3">原版 第十部分：第 325–360 章</option>
      </optgroup>
    </select>

    <label class="auto-next"><input id="autoNext" type="checkbox"><span>播完自動播放下一部</span></label>
    <button class="play-button" id="playPause" type="button">▶ 點擊播放</button>
    <audio id="audioPlayer" controls preload="auto" playsinline></audio>
    <div class="seek-controls"><button class="seek-button" id="back10" type="button">↶ 倒退 10 秒</button><button class="seek-button" id="forward10" type="button">前進 10 秒 ↷</button></div>
    <div class="status" id="statusText">準備就緒，點擊播放即可</div>
    <div class="instructions">勾選「播完自動播放下一部」後，每一部結束會直接接下一部。取消勾選後，則會重複播放目前這一部。藍牙耳機的播放／暫停鍵也可繼續使用；每一部會分別記住播放進度。</div>
  </div>

  <script>
    const select=document.getElementById('trackSelect'),player=document.getElementById('audioPlayer'),status=document.getElementById('statusText'),playPause=document.getElementById('playPause'),autoNext=document.getElementById('autoNext');
    const tracks=Array.from(select.options,option=>option.value);
    let currentFile=localStorage.getItem('audioLastTrack')||select.value,lastSavedSecond=-1;
    if(!tracks.includes(currentFile))currentFile=select.value;
    select.value=currentFile;
    autoNext.checked=localStorage.getItem('audioAutoNext')==='true';
    const progressKey=()=>`audioProgress_${currentFile}`;
    const currentName=()=>select.options[select.selectedIndex].text;

    function formatTime(seconds){const m=Math.floor(seconds/60),s=Math.floor(seconds%60);return `${m} 分 ${s} 秒`}
    function saveProgress(){if(Number.isFinite(player.currentTime)&&player.currentTime>0)localStorage.setItem(progressKey(),String(player.currentTime))}
    function updateLoop(){player.loop=!autoNext.checked}
    function updateMediaSession(){if(!('mediaSession'in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:currentName(),artist:'台股商戰有聲書',album:'有聲書播放器'})}
    function safePlay(){player.play().catch(()=>{status.textContent='請先在網頁上按一次播放；之後可用藍牙耳機控制。'})}
    function loadTrack(file,playAfterLoad=false){saveProgress();currentFile=file;localStorage.setItem('audioLastTrack',file);select.value=file;player.pause();player.src=encodeURI(file);updateLoop();updateMediaSession();player.load();status.textContent=`載入中：${currentName()}`;playPause.textContent='▶ 點擊播放';if(playAfterLoad)player.addEventListener('canplay',safePlay,{once:true})}
    function seekBy(seconds){if(!Number.isFinite(player.duration))return;player.currentTime=Math.max(0,Math.min(player.duration,player.currentTime+seconds));saveProgress();status.textContent=`目前位置：${formatTime(player.currentTime)}`}
    function nextTrack(){const index=tracks.indexOf(currentFile);return index>=0&&index<tracks.length-1?tracks[index+1]:null}

    select.addEventListener('change',()=>loadTrack(select.value));
    autoNext.addEventListener('change',()=>{localStorage.setItem('audioAutoNext',String(autoNext.checked));updateLoop();status.textContent=autoNext.checked?'已開啟：播完自動下一部':'已關閉：重複播放目前這一部'});
    playPause.addEventListener('click',()=>player.paused?safePlay():player.pause());
    document.getElementById('back10').addEventListener('click',()=>seekBy(-10));
    document.getElementById('forward10').addEventListener('click',()=>seekBy(10));
    player.addEventListener('loadedmetadata',()=>{const saved=Number(localStorage.getItem(progressKey())||0);if(saved>0&&saved<player.duration-2){player.currentTime=saved;status.textContent=`已回到上次進度：${formatTime(saved)}`}else status.textContent='準備就緒，點擊播放即可'});
    player.addEventListener('timeupdate',()=>{const second=Math.floor(player.currentTime);if(second!==lastSavedSecond&&second%5===0){lastSavedSecond=second;saveProgress()}});
    player.addEventListener('play',()=>{playPause.textContent='⏸ 暫停播放';status.textContent=`正在播放：${currentName()}`});
    player.addEventListener('pause',()=>{saveProgress();if(!player.ended)playPause.textContent='▶ 繼續播放'});
    player.addEventListener('ended',()=>{localStorage.removeItem(progressKey());const next=nextTrack();if(autoNext.checked&&next){status.textContent='本部結束，正在播放下一部…';loadTrack(next,true)}else if(autoNext.checked){status.textContent='全部播放完畢'}else{status.textContent='本部結束，將重複播放目前這一部'}});
    window.addEventListener('pagehide',saveProgress);document.addEventListener('visibilitychange',()=>{if(document.hidden)saveProgress()});

    if('mediaSession'in navigator){for(const [action,handler] of [['play',safePlay],['pause',()=>player.pause()],['seekbackward',()=>seekBy(-10)],['seekforward',()=>seekBy(10)],['nexttrack',()=>{const next=nextTrack();if(next)loadTrack(next,true)}],['previoustrack',()=>seekBy(-10)]]){try{navigator.mediaSession.setActionHandler(action,handler)}catch{}}}
    loadTrack(currentFile);
  </script>
</body>
</html>
